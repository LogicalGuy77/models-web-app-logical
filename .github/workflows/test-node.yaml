name: Frontend Test
on:
  pull_request:
    paths:
    - frontend/**
    - common/frontend/**
jobs:
  frontend-format-linting-check:
    name: Code format and lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 16
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          common/frontend/kubeflow-common-lib/package-lock.json
    - name: Format code
      run: |
        npm install prettier@2.8.8 --prefix ./frontend
        make prettier-check
    - name: Lint code
      run: |
        cd frontend
        npm ci --no-audit
        npm run lint-check
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 16
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          common/frontend/kubeflow-common-lib/package-lock.json
    - name: Build Common Library
      run: |
        cd common/frontend/kubeflow-common-lib
        npm ci --no-audit
        npm run build
        npm link ./dist/kubeflow
    - name: Install Frontend Dependencies and Setup Styles
      run: |
        cd frontend
        npm ci --no-audit
        npm link kubeflow
        # Copy styles from kubeflow source to local styles directory
        mkdir -p ./src/styles/
        cp -r ../common/frontend/kubeflow-common-lib/projects/kubeflow/src/styles/* ./src/styles/
        # Also copy to node_modules for the copyCSS script
        mkdir -p ./node_modules/kubeflow/styles/
        cp -r ../common/frontend/kubeflow-common-lib/projects/kubeflow/src/styles/* ./node_modules/kubeflow/styles/
    - name: Run Unit Tests
      run: |
        cd frontend
        npm run test:jest
  frontend-mock-tests:
    name: Frontend Mock Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 16
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          common/frontend/kubeflow-common-lib/package-lock.json
    - name: Build Common Library
      run: |
        cd common/frontend/kubeflow-common-lib
        npm ci --no-audit
        npm run build
        npm link ./dist/kubeflow
    - name: Install Frontend Dependencies and Setup Styles
      run: |
        cd frontend
        npm ci --no-audit
        npm link kubeflow
        # Copy styles from kubeflow source to local styles directory
        mkdir -p ./src/styles/
        cp -r ../common/frontend/kubeflow-common-lib/projects/kubeflow/src/styles/* ./src/styles/
        # Also copy to node_modules for the copyCSS script
        mkdir -p ./node_modules/kubeflow/styles/
        cp -r ../common/frontend/kubeflow-common-lib/projects/kubeflow/src/styles/* ./node_modules/kubeflow/styles/
        # Copy assets as well
        mkdir -p ./node_modules/kubeflow/assets/
        cp -r ../common/frontend/kubeflow-common-lib/projects/kubeflow/src/assets/* ./node_modules/kubeflow/assets/
    - name: Run E2E Tests
      run: |
        cd frontend
        npm run e2e:cypress:ci
